{% extends "base.html" %}

{% block title %}Page Not Found | DigiGrow{% endblock %}

{% block page_css %}

{% endblock %}

{% block content %}
<section class="section not-found-page">

        <h1>Page not found</h1>

        <p class="section-intro">

        <div class="actions">

        </div>
    </div>
</section>
{% endblock %}
